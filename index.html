<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masters Atlas</title>
<meta name="description" content="One hundred analytics, AI and technology-management master's programmes across 27 countries, with admission steps, tests and scholarships for Indian applicants, scored on a fixed budget.">
<meta name="theme-color" content="#0B6B73">
<meta property="og:title" content="Masters Atlas">
<meta property="og:description" content="Compare overseas master's programmes on cost, visa route, PR chances and fit. Re-weight the scores to re-rank.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%230B6B73'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cellipse cx='32' cy='32' rx='8' ry='19' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M13 32h38' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='M46 10l2.4 5.6L54 18l-5.6 2.4L46 26l-2.4-5.6L38 18l5.6-2.4z' fill='%23F2B84B'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working page. Controls on top, a continent > country > university tree below, and a detail page per programme opened by hash (#p12). */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#12202A; --muted:#566772; --line:#D3DDE2;
  --accent:#0B6B73; --accent-ink:#FFFFFF; --accent-tint:#DDEFF0;
  --good:#1D7448; --good-tint:#DCF0E4; --warn:#8F5B00; --warn-tint:#F8EBCF; --bad:#A93329; --bad-tint:#F6DDDA;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gold:#B26E00; --gold-tint:#FBEFD3; --glow:rgba(11,107,115,.16); --shadow:0 1px 2px rgba(18,32,42,.05),0 8px 24px -12px rgba(18,32,42,.18);
  --mono-l:90%; --mono-d:28%;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D151A; --surface:#15212A; --ink:#E5EDF1; --muted:#90A3AE; --line:#263640;
  --accent:#55C2CA; --accent-ink:#06262A; --accent-tint:#133238;
  --good:#6FD39B; --good-tint:#15342A; --warn:#E9B64E; --warn-tint:#3A2E12; --bad:#F08A80; --bad-tint:#3B1E1B; --gold:#F2B84B; --gold-tint:#3A2E12; --glow:rgba(85,194,202,.14); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --mono-l:22%; --mono-d:78%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151A; --surface:#15212A; --ink:#E5EDF1; --muted:#90A3AE; --line:#263640;
  --accent:#55C2CA; --accent-ink:#06262A; --accent-tint:#133238;
  --good:#6FD39B; --good-tint:#15342A; --warn:#E9B64E; --warn-tint:#3A2E12; --bad:#F08A80; --bad-tint:#3B1E1B; --gold:#F2B84B; --gold-tint:#3A2E12; --glow:rgba(85,194,202,.14); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --mono-l:22%; --mono-d:78%; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60rem 30rem at 85% -8%,var(--glow),transparent 70%),
    radial-gradient(var(--line) 1px,transparent 1.2px) 0 0/24px 24px;
  -webkit-mask-image:linear-gradient(#000 0,rgba(0,0,0,.55) 40%,transparent 85%);mask-image:linear-gradient(#000 0,rgba(0,0,0,.55) 40%,transparent 85%)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.top h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.btn{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer;
  transition:transform 160ms var(--ease-out),border-color 160ms ease,background-color 160ms ease}
.btn:active,.chip:active,.links a:active,.iconbtn:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.btn:hover{border-color:var(--accent)}}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.controls{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input[type=search],input[type=text],input[type=url],select,textarea{font:400 14px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
@media (hover:hover) and (pointer:fine){.chip:hover{border-color:var(--accent)}}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{font-family:var(--f-data);opacity:.75;margin-left:5px;font-size:12px}
details.weights{margin-bottom:18px}
details.weights summary{cursor:pointer;font-weight:600;padding:2px 0}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin-top:12px}
.wgrid label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px}
.wgrid input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);margin:0 0 14px}
.summary b{color:var(--ink);font-family:var(--f-data);font-weight:500}
.cont{margin-top:26px}
.cont>h2{font-size:22px;display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.cont>h2 small{margin-left:auto}
.cont>h2 small{font:400 13px var(--f-data);color:var(--muted)}
.country{margin-top:16px}
.country>h3{font-size:16px;display:flex;align-items:center;gap:9px;margin-bottom:8px}
.country>h3 small{font:400 12px var(--f-data);color:var(--muted)}
.uni{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.uni>.un{padding:9px 14px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:10px}
.prow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 92px 74px 62px;gap:4px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);color:inherit;text-decoration:none;transition:background-color 160ms ease,transform 160ms var(--ease-out)}
.prow::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);transform:scaleY(0);transition:transform 200ms var(--ease-out)}
.prow:active{transform:scale(.995)}
@media (hover:hover) and (pointer:fine){.prow:hover::before{transform:scaleY(1)}}
.uni>.un+.prow{border-top:0}
@media (hover:hover) and (pointer:fine){.prow:hover{background:var(--accent-tint)}}
.prow .pn{font-weight:500;min-width:0}
.prow .pn span{display:block;font-size:12px;color:var(--muted);font-weight:400}
.cost{font:500 13px var(--f-data);text-align:right}
.meter{display:block;position:relative;height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:visible}
.meter b{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--accent);transform-origin:left;transition:transform 400ms var(--ease-out)}
.meter.over b{background:var(--bad)}.meter.near b{background:var(--gold)}
.meter::after{content:"";position:absolute;left:75%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.55}
.badge{font:500 11px var(--f-body);padding:3px 7px;border-radius:4px;text-align:center;white-space:nowrap}
.b-yes{background:var(--good-tint);color:var(--good)}
.b-edge{background:var(--warn-tint);color:var(--warn)}
.b-no{background:var(--bad-tint);color:var(--bad)}
.score{font:500 14px var(--f-data);text-align:center;border-radius:4px;padding:4px 0}
.s-hi{background:var(--good-tint);color:var(--good)}
.s-mid{background:var(--warn-tint);color:var(--warn)}
.s-lo{background:var(--bad-tint);color:var(--bad)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* detail */
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px 8px}
.dgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;margin-top:14px}
.dgrid>*{min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;box-shadow:var(--shadow)}
.fact dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fact dd{margin:3px 0 0;font:500 14px var(--f-data);overflow-wrap:anywhere}
.panel h3{font-size:16px;margin-bottom:8px}
.panel p{margin:0 0 8px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i b{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px;transform-origin:left}
.bar .v{font-family:var(--f-data);text-align:right}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{font:500 13px var(--f-body);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);transition:transform 160ms var(--ease-out),border-color 160ms ease}
@media (hover:hover) and (pointer:fine){.links a:hover{border-color:var(--accent)}}
ul.src{margin:6px 0 0;padding-left:18px;font-size:13px;overflow-wrap:anywhere}
.cm{border-top:1px solid var(--line);padding:10px 0}
.cm:first-child{border-top:0}
.cm .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cm p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .vid{display:inline-block;margin-top:6px;font-size:13px;overflow-wrap:anywhere}
.cm .del{margin-left:auto;font-size:12px;border:0;background:none;color:var(--bad);cursor:pointer;padding:2px 4px}
.form{display:grid;gap:8px;margin-top:10px}
.err{color:var(--bad);font-size:13px;min-height:1.2em}

/* brand, hero, stats */
.brand{display:inline-flex;align-items:center;gap:10px;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.logo{width:34px;height:34px;flex:none;color:var(--accent)}
.logo .spark{fill:var(--gold)}
.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,var(--surface) 55%,var(--accent-tint));padding:22px 24px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero-copy{position:relative;z-index:1;max-width:560px}
.hero h1{font-size:clamp(32px,5.2vw,48px);font-weight:700;letter-spacing:-.025em;line-height:1.02;margin:12px 0 10px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.hero-actions{position:relative;z-index:1;display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.globe{position:absolute;right:28px;top:14px;width:232px;height:232px;color:var(--accent);opacity:.9;pointer-events:none}
@media (max-width:960px){.globe{opacity:.4}}
.globe .rim{fill:none;stroke:currentColor;stroke-width:1.2}
.globe .lat{fill:none;stroke:currentColor;stroke-width:.8;opacity:.4}
.globe .mer{fill:none;stroke:currentColor;stroke-width:.9;opacity:.55;transform-box:fill-box;transform-origin:center;animation:meridian 14s linear infinite}
.globe .halo{fill:var(--accent);opacity:.07}
.globe .pin{fill:var(--gold)}
.globe .pulse{fill:none;stroke:var(--gold);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:pulse 3.2s var(--ease-out) infinite}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:20px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--surface);padding:10px 14px;min-width:0}
.stat b{display:block;font:500 24px var(--f-data);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;transition:transform 160ms var(--ease-out),border-color 160ms ease}
@media (hover:hover) and (pointer:fine){.iconbtn:hover{border-color:var(--accent)}}
.iconbtn svg{width:18px;height:18px}
.themebtn{position:absolute;top:16px;right:16px;z-index:2}
/* logos and flags */
.ulogo{--h:200;position:relative;display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:8px;overflow:hidden;background:hsl(var(--h) 55% var(--mono-l));color:hsl(var(--h) 45% var(--mono-d));font:700 11px var(--f-display);letter-spacing:.02em;border:1px solid var(--line)}
.ulogo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.ulogo.lg{width:56px;height:56px;border-radius:14px;font-size:20px}.ulogo.lg img{padding:7px}
.flag{width:20px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.flag.lg{width:24px;height:18px}
.dhead{display:flex;align-items:center;gap:14px;margin-top:2px}
.dhead h1{font-size:clamp(24px,4vw,32px)}
.dsub{display:flex;align-items:center;gap:8px;margin:4px 0 0;color:var(--muted)}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ring{position:relative;flex:none;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring.s-hi,.ring.s-mid,.ring.s-lo{background:none;color:var(--ink)}
.ring .tr{stroke:var(--line)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset 600ms var(--ease-out)}
.ring.s-mid .fg{stroke:var(--gold)}.ring.s-lo .fg{stroke:var(--bad)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:500 18px var(--f-data);background:none!important;padding:0}
.foot{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center}
/* programme depth */
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;margin:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font:600 12px var(--f-data);display:grid;place-items:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11.5px;top:26px;bottom:2px;width:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.kv dd{margin:0 0 8px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.tag{font:500 12px var(--f-body);padding:3px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.bul{margin:0;padding-left:18px}.bul li{margin:0 0 6px}
.sch{border-top:1px solid var(--line);padding:10px 0}.sch:first-of-type{border-top:0;padding-top:2px}
.sch b{display:block}.sch .amt{font:500 13px var(--f-data);color:var(--good)}
details.guide summary{cursor:pointer;font:600 16px var(--f-display);padding:2px 0}
details.guide[open] summary{margin-bottom:8px}
.conf{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}.conf.verified .dot{background:var(--good)}
/* motion: entry only, played on first paint and route change; base state stays visible so reduced motion is safe */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes meridian{0%,100%{transform:scaleX(1)}16.67%{transform:scaleX(.866)}33.33%{transform:scaleX(.5)}50%{transform:scaleX(0)}66.67%{transform:scaleX(.5)}83.33%{transform:scaleX(.866)}}
@keyframes pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes ringin{from{stroke-dashoffset:var(--circ)}}
.fresh .hero-copy>*,.fresh .stats,.fresh .controls,.fresh .chips,.fresh .weights,.fresh .crumb,.fresh .dtop,.fresh .fact,.fresh .dgrid>div>*{animation:rise 420ms var(--ease-out) backwards;animation-delay:calc(var(--i,0)*55ms)}
#tree.fresh .cont,#tree.fresh .uni{animation:rise 420ms var(--ease-out) backwards;animation-delay:calc(min(var(--i,0),10)*45ms + 160ms)}
#tree.fresh .meter b{animation:grow 600ms var(--ease-out) backwards;animation-delay:calc(min(var(--i,0),10)*45ms + 300ms)}
.fresh .bar i b{animation:grow 700ms var(--ease-out) backwards;animation-delay:calc(var(--i,0)*60ms + 250ms)}
.fresh .ring .fg{animation:ringin 800ms var(--ease-out) backwards .2s}
@media (max-width:720px){
  .kv{grid-template-columns:1fr}.kv dt{padding-top:6px}
  .controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:1/-1}
  .dgrid{grid-template-columns:1fr}
  .prow{grid-template-columns:minmax(0,1fr) auto auto}
  .prow .badge{grid-column:2}
  .prow .cost{grid-column:1;text-align:left}
  .prow .score{grid-column:3;grid-row:1/3;align-self:center;padding:4px 8px}
  .bar{grid-template-columns:96px minmax(0,1fr) 40px}
  .hero{padding:18px 16px 14px}
  .globe{width:220px;height:220px;right:-70px;top:70px;opacity:.4}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ring{width:60px;height:60px}.ring span{font-size:15px}
  .cont>h2 small{font-size:12px}
}
@media (max-width:480px){.themebtn{top:12px;right:12px}.brand{padding-right:48px;letter-spacing:.1em;font-size:12px}.hero h1{margin-top:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap" id="app" aria-live="polite"><div class="empty">Loading programmes...</div></div>

<script>
(function(){
"use strict";
var DATA=null, W={}, WDEF={}, LABEL={}, S={q:"",cont:"All",country:"All",budget:"all",verify:"all",sort:"score"};
var DET={}, CTRY={}, dbRef=null, userRef=null, commentsByPid={}, unsub=null, canWrite=null, myId=null, names={}, isOwner=false;
var app=document.getElementById("app");
var animate=true;
var REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var NS="http://www.w3.org/2000/svg";

    h("span",{class:"badge "+vclass(p.status),text:p.status}));
  if(D){
    st.appendChild(h("p",{class:"note conf "+(D.confidence==="verified"?"verified":""),style:"margin-top:10px"},h("span",{class:"dot"}),"Detail confidence: "+D.confidence+". Checked "+D.checked+"."));
    if(D.unverified&&D.unverified.length){st.appendChild(h("p",{class:"note",style:"margin:6px 0 2px;font-weight:600",text:"Not confirmed"}));st.appendChild(bullets(D.unverified));}
  }
  var allSrc=p.sourceUrls.slice();if(D&&D.sources)D.sources.forEach(function(u){if(allSrc.indexOf(u)<0)allSrc.push(u);});
  if(allSrc.length){var ul=h("ul",{class:"src"});allSrc.forEach(function(u){ul.appendChild(h("li",null,h("a",{href:u,target:"_blank",rel:"noopener noreferrer",text:u})));});st.appendChild(h("p",{class:"note",style:"margin-top:10px",text:"Sources used"}));st.appendChild(ul);}
  else st.appendChild(h("p",{class:"note",style:"margin-top:10px",text:"No official page was retrieved for this row. Treat every figure as indicative and check the university site."}));
  right.appendChild(st);

  var lk=h("section",{class:"panel"},h("h3",{text:"Links"}));
  var lw=h("div",{class:"links"});
  lw.appendChild(h("a",{href:p.links.university,target:"_blank",rel:"noopener noreferrer",text:"University site"}));
  if(p.links.program)lw.appendChild(h("a",{href:p.links.program,target:"_blank",rel:"noopener noreferrer",text:"Programme page"}));
  lw.appendChild(h("a",{href:p.links.youtube,target:"_blank",rel:"noopener noreferrer",text:"Search YouTube"}));
  lk.appendChild(lw);
  lk.appendChild(h("p",{class:"note",style:"margin-top:8px",text:"The YouTube link is a search for this programme, not a vetted video. Add the videos you trust in the thread below."}));
  right.appendChild(lk);

  var cm=h("section",{class:"panel",id:"comments"},h("h3",{text:"Comments and videos"}),h("div",{id:"cm-list"},h("p",{class:"note",text:"Loading comments..."})),h("div",{id:"cm-form"}));
  right.appendChild(cm);

  stag(left.children);stag(right.children);
  grid.appendChild(left);grid.appendChild(right);
  root.appendChild(grid);
  app.replaceChildren(root);
  startComments(p);
}

/* comments via db */
function claude_use(n){return (window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)).catch(function(){return null;});}
function ytOk(u){return /^https:\/\/(www\.youtube\.com\/(watch\?|shorts\/|playlist\?)|youtu\.be\/)/.test(u);}
function startComments(p){
  var list=document.getElementById("cm-list"),form=document.getElementById("cm-form");
  claude_use("db").then(function(db){
    if(!db){list.replaceChildren(h("p",{class:"note",text:"Comments are not available in this view. Open the shared page while signed in to read and post."}));return;}
    dbRef=db;
    return claude_use("user").then(function(user){
      userRef=user;
      if(user){
        if(user.id)user.id().then(function(i){myId=i;});
        isOwner=user.isOwner?user.isOwner():false;
        if(user.can)try{Promise.resolve(user.can("data.write")).then(function(v){canWrite=v;buildForm(p,form);});}catch(e){}
      }
      buildForm(p,form);
      var q=db.collection("comments").where("pid","==",p.id).orderBy("ts","desc").limit(200);
      unsub=q.onSnapshot(function(snap){
        var docs=snap.docs.map(function(d){var x=d.data();x._id=d.id;return x;});
        resolveNames(docs).then(function(){paintComments(list,docs,p);});
      },function(e){list.replaceChildren(h("p",{class:"note",text:"Comments could not load ("+(e&&e.code||"error")+")."}));});
    });
  });
}
function resolveNames(docs){
  var ids=[];docs.forEach(function(d){if(d.uid&&ids.indexOf(d.uid)<0)ids.push(d.uid);});
  if(!userRef||!userRef.profiles||!ids.length)return Promise.resolve();
  return userRef.profiles(ids).then(function(ps){ids.forEach(function(i){names[i]=(ps&&ps[i]&&ps[i].name)||"";});}).catch(function(){});}
function paintComments(host,docs,p){
  if(!docs.length){host.replaceChildren(h("p",{class:"note",text:"No comments yet. Share what you learned about fees, admission, visa timing or campus life for this programme."}));return;}
  var frag=h("div");
  docs.forEach(function(d){
    var when=d.ts?new Date(d.ts).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
    var meta=h("div",{class:"meta"},h("b",{text:names[d.uid]||"Someone"}),h("span",{text:when}));
    if(d.uid===myId||isOwner){meta.appendChild(h("button",{class:"del",type:"button",text:"Delete",onclick:function(){
      dbRef.doc("comments/"+d._id).delete().catch(function(){});}}));}
    var c=h("div",{class:"cm"},meta);
    if(d.text)c.appendChild(h("p",{text:d.text}));
    if(d.video&&ytOk(d.video))c.appendChild(h("a",{class:"vid",href:d.video,target:"_blank",rel:"noopener noreferrer",text:"Video: "+(d.vtitle||d.video)}));
    frag.appendChild(c);});
  host.replaceChildren(frag);
}
function buildForm(p,host){
  if(!dbRef){return;}
  if(canWrite===false){host.replaceChildren(h("p",{class:"note",text:"You can read comments here. Posting needs contributor access to this page."}));return;}
  var txt=h("textarea",{id:"cm-text",placeholder:"Comment on fees, admission, visa or outcomes",maxlength:"1200"});
  var vt=h("input",{type:"text",id:"cm-vtitle",placeholder:"Video title (optional)",maxlength:"120"});
  var vu=h("input",{type:"url",id:"cm-video",placeholder:"YouTube link (optional)"});
  var err=h("div",{class:"err",id:"cm-err"});
  var btn=h("button",{class:"btn primary",type:"submit",text:"Post"});
  var fm=h("form",{class:"form",onsubmit:function(e){
    e.preventDefault();err.textContent="";
    var t=txt.value.trim(),v=vu.value.trim();
    if(!t&&!v){err.textContent="Write a comment or add a YouTube link.";return;}
    if(v&&!ytOk(v)){err.textContent="Use a full youtube.com or youtu.be link.";return;}
    btn.disabled=true;
    var doc={pid:p.id,text:t,ts:Date.now(),uid:myId||null};
    if(v){doc.video=v;doc.vtitle=vt.value.trim();}
    dbRef.collection("comments").add(doc).then(function(){txt.value="";vu.value="";vt.value="";btn.disabled=false;})
      .catch(function(x){btn.disabled=false;err.textContent=(x&&x.code==="invalid_argument")?"You can read this thread but not post to it.":"Could not post. Try again in a moment.";});
  }},txt,vt,vu,err,btn);
  host.replaceChildren(fm);
}

/* CSV download */
function csvCell(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function downloadCsv(){
  var cols=["rank","continent","country","university","program","months","mode","tuition","living","costLakh","withinBudget","rel","emp","imm","pr","aff","adm","dur","weighted","visaNote","admission","intake","status"];
  var rows=[cols.join(",")];
  filtered().sort(sorter).forEach(function(p){rows.push(cols.map(function(c){return csvCell(p[c]);}).concat([csvCell(score(p).toFixed(2)),csvCell(p.links.university),csvCell(p.links.program),csvCell(p.links.youtube)]).join(","));});
  rows[0]+=",yourScore,universityLink,programLink,youtubeSearch";
  claude_use("downloads").then(function(d){if(d)d.save({filename:"masters-atlas.csv",data:rows.join("\n")}).catch(function(){});});
}
